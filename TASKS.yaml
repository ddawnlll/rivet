version: "0.3.0"
status: "EXECUTION_READY"
active_phase: 6

rules:
  - "Implement against frozen types in crates/ only"
  - "Every task must have unit/integration tests before mark done"
  - "Architecture invention is out of scope"

tasks:
  # =========================================================================
  # PHASE 1: WORKSPACE BOOTSTRAP & CANONICAL TYPE-LEVEL SKELETON
  # =========================================================================
  - id: "T-001"
    phase: 1
    title: "Rust Workspace & Cargo.toml Root Initialization"
    description: "Create the root Cargo.toml workspace and directory structure for all 12 crates."
    crates: ["rivet-types", "accp", "noesis", "praxis", "hephaestus", "rivet-store", "rivet-model", "rivet-model-genai", "rivet-runtime", "rivet-repository", "rivet-core", "rivet"]
    status: "DONE"
    acceptance_criteria:
      - "cargo check --workspace exits with 0"
      - "Cargo.lock generated"

  - id: "T-002"
    phase: 1
    title: "Canonical ID, Revision & Epistemic Types (rivet-types)"
    description: "Implement strongly typed IDs (SessionId, TaskId, ClaimId, EvidenceId, ArtifactId, Revision), EpistemicStatus, and Core Error types."
    crates: ["rivet-types"]
    status: "DONE"
    acceptance_criteria:
      - "All ID types have Display, Debug, Clone, PartialEq, Eq, Hash, Serialize, Deserialize"
      - "Revision implements strict ordering and hashing"

  - id: "T-003"
    phase: 1
    title: "ACCP 3.0 Typed Envelopes & Semantic Invariants (accp)"
    description: "Implement ACCP 3.0 message envelopes (ActionProposal, ActionDecision, ExecutionReceipt, ClaimProposal, VerificationRequest, VerificationReceipt, StateTransitionProposal, CompletionProposal, CompletionDecision) and invariant enforcement."
    crates: ["accp"]
    status: "DONE"
    acceptance_criteria:
      - "AccpMessage enum covers all 9 normative classes"
      - "Unit tests for illegal semantic casts (e.g. ModelClaim -> Observation rejection)"

  - id: "T-004"
    phase: 1
    title: "Noesis Memory & Event Ledger Contracts (noesis)"
    description: "Implement NoesisEvent, HardState materialized view, SoftWorkspace bounded RAM model, StatePromotion, and Invalidation rules."
    crates: ["noesis"]
    status: "DONE"
    acceptance_criteria:
      - "Event append and replay produces deterministic HardState"
      - "SoftWorkspace bounded capacity and eviction policy works"

  - id: "T-005"
    phase: 1
    title: "Model Backend & Action Contracts (rivet-model)"
    description: "Implement ModelBackend trait (invoke, stream), CognitiveAction parser, and InvocationReceipt accounting."
    crates: ["rivet-model"]
    status: "DONE"
    acceptance_criteria:
      - "ModelBackend trait defined with async invoke/stream"
      - "CognitiveAction deserializes typed tool/state/completion calls"

  # =========================================================================
  # PHASE 2: NOESIS STATE KERNEL & DURABLE STORE
  # =========================================================================
  - id: "N-001"
    phase: 2
    title: "redb Embedded HardStateStore Implementation (rivet-store)"
    description: "Implement HardStateStore trait backed by redb ACID table for NoesisEvent ledger and checkpointing."
    crates: ["rivet-store"]
    status: "DONE"
    acceptance_criteria:
      - "ACID transaction guarantees verified with crash/replay test"
      - "Zero-copy reads on event scans"

  - id: "N-002"
    phase: 2
    title: "Noesis SoftWorkspace Bounded Lifecycle & Eviction"
    description: "Implement working memory in RAM: active focus, hypotheses, candidate actions with strict token/item bound."
    crates: ["noesis"]
    status: "DONE"
    acceptance_criteria:
      - "Working memory cannot exceed configured token limit"
      - "Non-authoritative flag strictly preserved"

  - id: "N-003"
    phase: 2
    title: "Cognitive View Compiler Projection"
    description: "Compile HardState + SoftWorkspace + RepoFrontier into task-conditioned CognitiveView struct."
    crates: ["noesis", "rivet-core"]
    status: "DONE"
    acceptance_criteria:
      - "Produces concise CognitiveView payload"
      - "Excludes raw chat history and deferred subtree dumps"

  # =========================================================================
  # PHASE 3: PRAXIS & ACCP EXECUTION GATES
  # =========================================================================
  - id: "P-001"
    phase: 3
    title: "Praxis Mechanical Verification Engine (praxis)"
    description: "Implement test execution, output parsing (cargo test, pytest, etc.), and signed VerificationReceipt generation."
    crates: ["praxis"]
    status: "DONE"
    acceptance_criteria:
      - "Executes targeted tests without LLM intervention"
      - "Parses test pass/fail/error counts reliably"

  - id: "A-001"
    phase: 3
    title: "ACCP Action Authorization Policy Enforcer (accp)"
    description: "Enforce action permissions, read/write scopes, and destructive action blocks."
    crates: ["accp"]
    status: "DONE"
    acceptance_criteria:
      - "Rejects write actions outside declared scope"
      - "Blocks destructive actions without explicit user authority"

  # =========================================================================
  # PHASE 4: RUNTIME & REPOSITORY INDUCTION
  # =========================================================================
  - id: "R-001"
    phase: 4
    title: "OS Process & File Mutation Runtime (rivet-runtime)"
    description: "Implement sandboxed command execution (tokio::process) with timeout, cancellation, and stdout/stderr capture."
    crates: ["rivet-runtime"]
    status: "DONE"
    acceptance_criteria:
      - "Handles process timeouts and SIGINT cancellation cleanly"
      - "Safe atomic file writes"

  - id: "R-002"
    phase: 4
    title: "Adaptive Project Induction & Deterministic Census (rivet-repository)"
    description: "Implement fast tree walking, .gitignore parsing, size histograms, and DEFER tree classification."
    crates: ["rivet-repository"]
    status: "DONE"
    acceptance_criteria:
      - "Census finishes in <50ms for average repos"
      - "node_modules/target/vendor are DEFERRED, not deleted"

  # =========================================================================
  # PHASE 5: MODEL ADAPTER & CANONICAL COGNITIVE CYCLE
  # =========================================================================
  - id: "M-001"
    phase: 5
    title: "genai Multi-Provider Model Adapter (rivet-model-genai)"
    description: "Implement ModelBackend using genai crate supporting Anthropic, OpenAI, Gemini, Ollama."
    crates: ["rivet-model-genai"]
    status: "DONE"
    acceptance_criteria:
      - "Streaming and non-streaming responses normalized to ACCP actions"
      - "Token usage tracked in InvocationReceipt"

  - id: "C-001"
    phase: 5
    title: "Canonical Cognitive Cycle & RunPhase State Machine (rivet-core)"
    description: "Implement the end-to-end cognitive loop orchestrating View -> Model -> ACCP -> Runtime -> Praxis -> Noesis."
    crates: ["rivet-core"]
    status: "DONE"
    acceptance_criteria:
      - "Full cycle executes end-to-end without panics"
      - "Completion strictly requires Praxis PASS"

  # =========================================================================
  # PHASE 6: CLI & DOGFOODING HARNESS
  # =========================================================================
  - id: "U-001"
    phase: 6
    title: "Interactive Terminal REPL (rivet)"
    description: "Implement the CLI entrypoint (clap) and interactive chat/work loop."
    crates: ["rivet"]
    status: "DONE"
    acceptance_criteria:
      - "rivet . starts interactive session on current directory"
      - "Supports session resume from persistent redb store"

remaining_gaps:
  - id: "RG-001"
    priority: "P0"
    title: "LLM-led hierarchical repository relevance"
    status: "IN_PROGRESS"
    evidence: "Deterministic .gitignore-aware census and bounded signal frontier are implemented; model-selected recursive DESCEND/MAYBE/DEFER is not yet wired."
  - id: "RG-002"
    priority: "P0"
    title: "Full Praxis Verity pipeline through Harness verification"
    status: "IN_PROGRESS"
    evidence: "Harness now exposes run_verity_plan: it scope-checks the VerificationRequest, runs the PlanSpec-driven 8-gate VerityPipeline, converts its verdict into a scoped ACCP receipt, persists it in Noesis, and closes obligations only on PASS; completion still does not require a PlanSpec supplied for every task."
  - id: "RG-003"
    priority: "P0"
    title: "Credentialed real-provider evaluation"
    status: "TODO"
    evidence: "OpenCode/Zen endpoint, invoke, native stream, and credential-aware live tests exist; this environment has no OPENCODE_API_KEY or OPENCODE_ZEN_API_KEY, so no network run was recorded."
  - id: "RG-004"
    priority: "P1"
    title: "Revision-domain and repository snapshot invalidation"
    status: "IN_PROGRESS"
    evidence: "Action, verification, task, and completion paths enforce state/repository scopes; automatic repository snapshot change detection and dependent claim invalidation are not yet wired."
  - id: "RG-005"
    priority: "P1"
    title: "Crash-level persistence recovery proof"
    status: "IN_PROGRESS"
    evidence: "Redb checkpoint/event replay passes, and a child-process integration test now commits an event, exits before checkpoint, then verifies a fresh store recovers the append-log event; hard-kill/OS-failure coverage remains."
  - id: "RG-006"
    priority: "P1"
    title: "ACCP wire payload schema coverage"
    status: "IN_PROGRESS"
    evidence: "Strict 3.0 envelope, producer matrix, family/kind validation, typed VIEW/QUERY/SIGNAL carriers, and round-trip fixtures for every current AccpMessage carrier now pass; broader normative schema/fixture compatibility remains."
