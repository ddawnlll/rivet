[workspace]
resolver = "2"
members = [
    "crates/rivet-types",
    "crates/accp",
    "crates/noesis",
    "crates/rivet-view",
    "crates/praxis",
    "crates/hephaestus",
    "crates/rivet-store",
    "crates/rivet-model",
    "crates/rivet-model-genai",
    "crates/rivet-mcp",
    "crates/rivet-runtime",
    "crates/rivet-repository",
    "crates/rivet-core",
    "crates/rivet-service",
    "crates/rivet-api",
    "crates/rivet",
    "crates/rivet-eval",
    "crates/rivet-model-rig",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Rivet Developers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace crates
rivet-types = { path = "crates/rivet-types" }
accp = { path = "crates/accp" }
noesis = { path = "crates/noesis" }
rivet-view = { path = "crates/rivet-view" }
praxis = { path = "crates/praxis" }
hephaestus = { path = "crates/hephaestus" }
rivet-store = { path = "crates/rivet-store" }
rivet-model = { path = "crates/rivet-model" }
rivet-model-genai = { path = "crates/rivet-model-genai" }
rivet-model-rig = { path = "crates/rivet-model-rig" }
rivet-mcp = { path = "crates/rivet-mcp" }
rivet-runtime = { path = "crates/rivet-runtime" }
rivet-repository = { path = "crates/rivet-repository" }
rivet-core = { path = "crates/rivet-core" }
rivet-service = { path = "crates/rivet-service" }
rivet-api = { path = "crates/rivet-api" }
rivet-eval = { path = "crates/rivet-eval" }

# Rig LLM Framework
rig = { package = "rig-core", version = "0.42" }

# Common runtime & utilities
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
http-body-util = "0.1"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }

# Storage & Embedded DB
redb = "2.4"

# Model HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15"

# CLI / TUI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"

# Test & crypto dependencies
tempfile = "3.17"
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
libc = "0.2"
tiktoken-rs = "0.6"
lsp-types = "0.97"

# Production-grade hardened dependencies
cap-std = "4.0"
globset = "0.4"
ignore = "0.4"
rs_merkle = "1.5"
junit-parser = "1.6"
strip-ansi-escapes = "0.2"
eventsource-stream = "0.2"
keyring = "4.2"
secrecy = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
serde-saphyr = "1.2"
similar = "3.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"

gix = { version = "0.87", default-features = false, features = ["blob-diff", "parallel", "revision"] }
rlimit = "0.11"
windows = { version = "0.62", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }
landlock = "0.4"
seccompiler = "0.5"

# RivetService / Web transport
axum = { version = "0.7", features = ["json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }




